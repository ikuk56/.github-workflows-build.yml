name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar proyecto Android
        run: |
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'YtTv'
          include ':app'
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.yttv'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.yttv'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="YT TV"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/inject.js <<'EOF_FILE'
          (function () {
            if (window.__ytTvInstalled) return;
            window.__ytTvInstalled = true;

            // --- Bloqueo de anuncios: quitar los datos de anuncios de las respuestas del reproductor ---
            function clean(o) {
              if (!o || typeof o !== 'object') return o;
              if (Array.isArray(o)) {
                for (var i = 0; i < o.length && i < 8; i++) clean(o[i]);
                return o;
              }
              if (o.adPlacements) o.adPlacements = [];
              if (o.playerAds) o.playerAds = false;
              if (o.adSlots) o.adSlots = [];
              if (o.playerResponse) clean(o.playerResponse);
              return o;
            }

            var origParse = JSON.parse;
            JSON.parse = function () {
              return clean(origParse.apply(this, arguments));
            };

            if (window.Response && Response.prototype.json) {
              var origJson = Response.prototype.json;
              Response.prototype.json = function () {
                return origJson.apply(this, arguments).then(clean);
              };
            }

            // --- Avisar a la app cuando hay un video en reproduccion (para ocultar los controles) ---
            setInterval(function () {
              var v = document.querySelector('video');
              var p = !!v && !v.paused && !v.ended && v.readyState > 2 &&
                      location.hash.indexOf('watch') >= 0;
              if (p !== window.__lastPlaying) {
                window.__lastPlaying = p;
                try { AndroidBridge.playing(p); } catch (e) {}
              }
            }, 500);
          })();
          EOF_FILE
          mkdir -p app/src/main/java/com/example/yttv
          cat > app/src/main/java/com/example/yttv/MainActivity.java <<'EOF_FILE'
          package com.example.yttv;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebStorage;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;

          import androidx.webkit.WebViewCompat;
          import androidx.webkit.WebViewFeature;

          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.Locale;

          public class MainActivity extends Activity {

              // ============ AJUSTES ============
              static final String START_URL = "https://www.youtube.com/tv";
              static final String TV_UA = "Mozilla/5.0 (SMART-TV; Linux; Tizen 6.5) AppleWebKit/537.36 "
                      + "(KHTML, like Gecko) 85.0.4183.93/6.5 TV Safari/537.36";
              // true = conserva la sesion de YouTube; false = borra TODO al cerrar la app
              static final boolean KEEP_LOGIN = true;
              // segundos que se muestran los controles tras tocar la pantalla durante un video
              static final int HIDE_DELAY_MS = 4000;
              // =================================

              private WebView web;
              private FrameLayout controls;
              private boolean playing = false;
              private String injectJs = "";
              private final Handler ui = new Handler(Looper.getMainLooper());
              private final Runnable hideAgain = new Runnable() {
                  @Override public void run() {
                      if (playing) controls.setVisibility(View.GONE);
                  }
              };

              @SuppressLint({"SetJavaScriptEnabled", "ClickableViewAccessibility"})
              @Override
              protected void onCreate(Bundle ignored) {
                  super.onCreate(null); // nunca restaurar estado: cada arranque es limpio
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  injectJs = readAsset("inject.js");

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUserAgentString(TV_UA);
                  s.setSupportMultipleWindows(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setAllowFileAccess(false);

                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");

                  if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      WebViewCompat.addDocumentStartJavaScript(web, injectJs, new HashSet<>(Arrays.asList(
                              "https://www.youtube.com", "https://youtube.com", "https://*.youtube.com")));
                  }

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          return handleNavigation(v, r.getUrl());
                      }

                      @Override
                      public void onPageStarted(WebView v, String url, Bitmap favicon) {
                          // respaldo si el WebView no soporta script al inicio del documento
                          v.evaluateJavascript(injectJs, null);
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          if (isAdRequest(r.getUrl())) {
                              return new WebResourceResponse("text/plain", "utf-8",
                                      new ByteArrayInputStream(new byte[0]));
                          }
                          return null;
                      }
                  });

                  // Tocar la pantalla (sin controles visibles) los muestra unos segundos
                  web.setOnTouchListener((v, e) -> {
                      if (e.getAction() == MotionEvent.ACTION_UP) reveal();
                      return true;
                  });

                  root.addView(web, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  buildControls(root);
                  setContentView(root);

                  wipe();
                  web.loadUrl(START_URL);
                  web.requestFocus();
              }

              // ---------- Navegacion restringida: solo YouTube /tv ----------
              private boolean handleNavigation(WebView v, Uri u) {
                  String host = u.getHost() == null ? "" : u.getHost().toLowerCase(Locale.ROOT);
                  String path = u.getPath() == null ? "" : u.getPath();
                  if (host.equals("youtube.com") || host.endsWith(".youtube.com")) {
                      if (path.startsWith("/tv") || path.startsWith("/signin") || path.startsWith("/activate")) {
                          return false; // dejar cargar
                      }
                      v.loadUrl(START_URL); // cualquier otra pagina de YouTube -> modo TV
                      return true;
                  }
                  if (host.equals("google.com") || host.endsWith(".google.com")) return false;
                  return true; // bloquear cualquier otro destino
              }

              private boolean isAdRequest(Uri u) {
                  String host = u.getHost() == null ? "" : u.getHost().toLowerCase(Locale.ROOT);
                  String path = u.getPath() == null ? "" : u.getPath();
                  return host.endsWith("doubleclick.net")
                          || host.endsWith("googlesyndication.com")
                          || host.endsWith("googleadservices.com")
                          || path.contains("/pagead/")
                          || path.contains("/api/stats/ads")
                          || path.contains("/get_midroll_");
              }

              // ---------- Borrado de datos: sin historial ni pestañas persistentes ----------
              private void wipe() {
                  if (web != null) {
                      web.clearHistory();
                      web.clearCache(true);
                      web.clearFormData();
                  }
                  if (!KEEP_LOGIN) {
                      WebStorage.getInstance().deleteAllData();
                      CookieManager.getInstance().removeAllCookies(null);
                  }
                  CookieManager.getInstance().flush();
              }

              // ---------- Controles tactiles ----------
              private void buildControls(FrameLayout root) {
                  controls = new FrameLayout(this);

                  LinearLayout pad = new LinearLayout(this);
                  pad.setOrientation(LinearLayout.VERTICAL);
                  pad.setGravity(Gravity.CENTER_HORIZONTAL);
                  pad.addView(key("\u25B2", KeyEvent.KEYCODE_DPAD_UP));
                  LinearLayout mid = new LinearLayout(this);
                  mid.addView(key("\u25C0", KeyEvent.KEYCODE_DPAD_LEFT));
                  mid.addView(key("OK", KeyEvent.KEYCODE_ENTER));
                  mid.addView(key("\u25B6", KeyEvent.KEYCODE_DPAD_RIGHT));
                  pad.addView(mid, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  pad.addView(key("\u25BC", KeyEvent.KEYCODE_DPAD_DOWN));
                  FrameLayout.LayoutParams padLp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM | Gravity.START);
                  padLp.setMargins(dp(16), 0, 0, dp(16));
                  controls.addView(pad, padLp);

                  LinearLayout side = new LinearLayout(this);
                  side.setOrientation(LinearLayout.VERTICAL);
                  side.addView(key("\u23EF", KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE));
                  side.addView(key("\u21A9", KeyEvent.KEYCODE_ESCAPE)); // Atras
                  FrameLayout.LayoutParams sideLp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM | Gravity.END);
                  sideLp.setMargins(0, 0, dp(16), dp(16));
                  controls.addView(side, sideLp);

                  root.addView(controls, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
              }

              private Button key(String label, final int code) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(18);
                  b.setAllCaps(false);
                  b.setPadding(0, 0, 0, 0);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0x99000000);
                  bg.setCornerRadius(dp(16));
                  bg.setStroke(dp(1), 0x66FFFFFF);
                  b.setBackground(bg);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(64), dp(64));
                  lp.setMargins(dp(3), dp(3), dp(3), dp(3));
                  b.setLayoutParams(lp);
                  b.setOnClickListener(v -> {
                      sendKey(code);
                      reveal();
                  });
                  return b;
              }

              private void sendKey(final int code) {
                  final long down = SystemClock.uptimeMillis();
                  web.dispatchKeyEvent(new KeyEvent(down, down, KeyEvent.ACTION_DOWN, code, 0));
                  ui.postDelayed(() -> web.dispatchKeyEvent(
                          new KeyEvent(down, SystemClock.uptimeMillis(), KeyEvent.ACTION_UP, code, 0)), 60);
              }

              // Oculta los controles mientras hay un video reproduciendose
              private void setPlaying(boolean p) {
                  playing = p;
                  ui.removeCallbacks(hideAgain);
                  controls.setVisibility(p ? View.GONE : View.VISIBLE);
              }

              // Muestra los controles; si hay video, se vuelven a ocultar solos
              private void reveal() {
                  controls.setVisibility(View.VISIBLE);
                  ui.removeCallbacks(hideAgain);
                  if (playing) ui.postDelayed(hideAgain, HIDE_DELAY_MS);
              }

              private class Bridge {
                  @JavascriptInterface
                  public void playing(final boolean p) {
                      ui.post(() -> setPlaying(p));
                  }
              }

              // ---------- Utilidades y ciclo de vida ----------
              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private String readAsset(String name) {
                  try (InputStream in = getAssets().open(name)) {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      return out.toString("UTF-8");
                  } catch (IOException e) {
                      return "";
                  }
              }

              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              @Override
              public void onBackPressed() {
                  sendKey(KeyEvent.KEYCODE_ESCAPE); // "Atras" de YouTube TV; la app se sale con Inicio/Recientes
              }

              @Override protected void onResume() { super.onResume(); web.onResume(); }
              @Override protected void onPause() { web.onPause(); super.onPause(); }

              @Override
              protected void onDestroy() {
                  if (isFinishing()) wipe();
                  web.destroy();
                  super.onDestroy();
              }
          }
          EOF_FILE

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk yt-tv.apk
          gh release create "build-${{ github.run_number }}" yt-tv.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "YT TV build ${{ github.run_number }}" --notes "APK instalable (debug)"
